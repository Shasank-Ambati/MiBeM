<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 320" width="720" height="320" role="img" aria-label="Animation of the self-consistent field cycle in density functional theory"><title>Animation of the self-consistent field cycle in density functional theory</title><rect width="720" height="320" rx="10" fill="#faf9f5" stroke="#e0ddd5"/><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#1f2328"/></marker></defs><rect x="30" y="50" width="190" height="64" rx="8" fill="#ece8de" stroke="#1f2328" stroke-width="1.2"></rect><text x="125.0" y="77" font-size="13.5" text-anchor="middle" fill="#1f2328" font-weight="bold" font-family="system-ui,Segoe UI,Arial,sans-serif" >Initial guess</text><text x="125.0" y="97" font-size="12" text-anchor="middle" fill="#1f2328" font-weight="normal" font-family="system-ui,Segoe UI,Arial,sans-serif" >n&#8320;(r)</text><rect x="265" y="50" width="190" height="64" rx="8" fill="#ece8de" stroke="#1f2328" stroke-width="1.2"><animate attributeName="fill" values="#ece8de;#f3c9b5;#ece8de;#ece8de" keyTimes="0;0.1;0.25;1" dur="9.0s" begin="0.0s" repeatCount="indefinite"/></rect><text x="360.0" y="77" font-size="13.5" text-anchor="middle" fill="#1f2328" font-weight="bold" font-family="system-ui,Segoe UI,Arial,sans-serif" >Build potential</text><text x="360.0" y="97" font-size="12" text-anchor="middle" fill="#1f2328" font-weight="normal" font-family="system-ui,Segoe UI,Arial,sans-serif" >v_ext + v_H[n] + v_xc[n]</text><rect x="500" y="50" width="190" height="64" rx="8" fill="#ece8de" stroke="#1f2328" stroke-width="1.2"><animate attributeName="fill" values="#ece8de;#f3c9b5;#ece8de;#ece8de" keyTimes="0;0.1;0.25;1" dur="9.0s" begin="1.5s" repeatCount="indefinite"/></rect><text x="595.0" y="77" font-size="13.5" text-anchor="middle" fill="#1f2328" font-weight="bold" font-family="system-ui,Segoe UI,Arial,sans-serif" >Solve Kohn&#8211;Sham</text><text x="595.0" y="97" font-size="12" text-anchor="middle" fill="#1f2328" font-weight="normal" font-family="system-ui,Segoe UI,Arial,sans-serif" >equations for &#968;&#7522;, &#949;&#7522;</text><rect x="500" y="226" width="190" height="64" rx="8" fill="#ece8de" stroke="#1f2328" stroke-width="1.2"><animate attributeName="fill" values="#ece8de;#f3c9b5;#ece8de;#ece8de" keyTimes="0;0.1;0.25;1" dur="9.0s" begin="3.0s" repeatCount="indefinite"/></rect><text x="595.0" y="253" font-size="13.5" text-anchor="middle" fill="#1f2328" font-weight="bold" font-family="system-ui,Segoe UI,Arial,sans-serif" >New density</text><text x="595.0" y="273" font-size="12" text-anchor="middle" fill="#1f2328" font-weight="normal" font-family="system-ui,Segoe UI,Arial,sans-serif" >n&#8242; = &#931;|&#968;&#7522;|&#178;, mix with old</text><rect x="30" y="226" width="190" height="64" rx="8" fill="#ece8de" stroke="#1f2328" stroke-width="1.2"></rect><text x="125.0" y="253" font-size="13.5" text-anchor="middle" fill="#1f2328" font-weight="bold" font-family="system-ui,Segoe UI,Arial,sans-serif" >Energy, forces,</text><text x="125.0" y="273" font-size="12" text-anchor="middle" fill="#1f2328" font-weight="normal" font-family="system-ui,Segoe UI,Arial,sans-serif" >stress, DOS</text><polygon points="360,218 440,258 360,298 280,258" fill="#ece8de" stroke="#1f2328" stroke-width="1.2"><animate attributeName="fill" values="#ece8de;#f3c9b5;#ece8de;#ece8de" keyTimes="0;0.1;0.25;1" dur="9.0s" begin="4.5s" repeatCount="indefinite"/></polygon><text x="360" y="255" font-size="13.5" text-anchor="middle" fill="#1f2328" font-weight="bold" font-family="system-ui,Segoe UI,Arial,sans-serif" >n&#8242; &#8776; n ?</text><text x="360" y="273" font-size="12" text-anchor="middle" fill="#1f2328" font-weight="normal" font-family="system-ui,Segoe UI,Arial,sans-serif" >converged</text><path d="M220 82 L263 82" fill="none" stroke="#1f2328" stroke-width="1.6" marker-end="url(#a)"/><path d="M455 82 L498 82" fill="none" stroke="#1f2328" stroke-width="1.6" marker-end="url(#a)"/><path d="M595 114 L595 224" fill="none" stroke="#1f2328" stroke-width="1.6" marker-end="url(#a)"/><path d="M498 258 L442 258" fill="none" stroke="#1f2328" stroke-width="1.6" marker-end="url(#a)"/><path d="M280 258 L222 258" fill="none" stroke="#1f2328" stroke-width="1.6" marker-end="url(#a)"/><text x="251" y="248" font-size="12" text-anchor="middle" fill="#b4491f" font-weight="bold" font-family="system-ui,Segoe UI,Arial,sans-serif" >yes</text><path d="M360 218 L360 116" fill="none" stroke="#1f2328" stroke-width="1.6" marker-end="url(#a)"/><text x="408" y="170" font-size="12" text-anchor="middle" fill="#b4491f" font-weight="bold" font-family="system-ui,Segoe UI,Arial,sans-serif" >no: repeat</text><circle r="7" fill="#b4491f"><animateMotion dur="9.0s" repeatCount="indefinite" path="M360 82 L595 82 L595 258 L360 258 Z"/></circle><text x="360" y="24" font-size="13" text-anchor="middle" fill="#8b9097" font-weight="normal" font-family="system-ui,Segoe UI,Arial,sans-serif" >The self-consistent field (SCF) cycle: the density defines the potential that defines the density</text><text x="360" y="312" font-size="12" text-anchor="middle" fill="#8b9097" font-weight="normal" font-family="system-ui,Segoe UI,Arial,sans-serif" >Each pass costs one diagonalisation; mixing the old and new density stabilises the loop.</text></svg>